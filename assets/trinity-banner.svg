<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">TRINITY AI LABS · Munich</title>
  <desc id="d">Three warm overlapping rings — people, voice and technology — with gentle sound waves at their centre; TRINITY in braille. Most software asks you to look. We build software that listens. Come in, build what makes sense.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1830"/><stop offset=".5" stop-color="#1a1426"/><stop offset="1" stop-color="#120f1d"/></linearGradient>
    <radialGradient id="dawn" cx="15%" cy="55%" r="60%"><stop offset="0" stop-color="#ff7a59" stop-opacity=".35"/><stop offset=".5" stop-color="#ff4d6d" stop-opacity=".10"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></radialGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="340" y1="0" x2="740" y2="0" spreadMethod="reflect"><stop offset="0.00" stop-color="#ffb347"/><stop offset="0.20" stop-color="#ff7a59"/><stop offset="0.40" stop-color="#ff4d6d"/><stop offset="0.60" stop-color="#f472b6"/><stop offset="0.80" stop-color="#ff7a59"/><stop offset="1.00" stop-color="#ffb347"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="24s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-220 0;-220 0;1150 0;1150 0" keyTimes="0;.6;.85;1" dur="12s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="warm" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feColorMatrix in="b" values="1 0 0 0 0  0 .55 0 0 0  0 0 .4 0 0  0 0 0 .7 0" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:'SF Mono',Menlo,Consolas,monospace}
      .sans text{font-family:-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
      .ring{animation:ring 12s ease-in-out infinite;transform-box:view-box}
      @keyframes ring{0%,100%{transform:scale(1);fill-opacity:.10}50%{transform:scale(1.06);fill-opacity:.2}}
      .core{animation:core 6.0s ease-in-out infinite}
      @keyframes core{0%,100%{opacity:.7}50%{opacity:1}}
      .wave{animation:wave 12s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
      @keyframes wave{0%{transform:scale(.6);opacity:0}10%{opacity:.8}60%{transform:scale(3.4);opacity:0}100%{opacity:0}}
      .braille{fill:#ffb347;animation:br 12s ease-in-out infinite}
      @keyframes br{0%,40%{opacity:.35}50%,75%{opacity:1}85%,100%{opacity:.35}}
      .a{animation:a 12s ease-in-out infinite}@keyframes a{0%,6%{opacity:0}12%,40%{opacity:1}46%,100%{opacity:0}}
      .b{opacity:0;animation:b 12s ease-in-out infinite}@keyframes b{0%,48%{opacity:0}54%,92%{opacity:1}98%,100%{opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      @keyframes m0{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-29px,-255px)}} @keyframes m1{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-7px,-148px)}} @keyframes m2{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-30px,-183px)}} @keyframes m3{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(18px,-160px)}} @keyframes m4{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-30px,-153px)}} @keyframes m5{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-12px,-162px)}} @keyframes m6{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-19px,-172px)}} @keyframes m7{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-20px,-226px)}} @keyframes m8{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(8px,-120px)}} @keyframes m9{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(14px,-243px)}} @keyframes m10{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-14px,-134px)}} @keyframes m11{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-6px,-213px)}} @keyframes m12{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-23px,-170px)}} @keyframes m13{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(19px,-184px)}} @keyframes m14{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-28px,-195px)}} @keyframes m15{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(28px,-212px)}} @keyframes m16{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-11px,-143px)}} @keyframes m17{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(16px,-158px)}} @keyframes m18{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(8px,-140px)}} @keyframes m19{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(22px,-208px)}} @keyframes m20{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(21px,-128px)}} @keyframes m21{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(10px,-153px)}} @keyframes m22{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(24px,-135px)}} @keyframes m23{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(3px,-163px)}} @keyframes m24{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(-12px,-190px)}} @keyframes m25{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(10px,-165px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.b{opacity:1}.a{opacity:0}.braille{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#card)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#dawn)"/>
  <g><circle style="animation:m0 12s ease-out -9.54s infinite" cx="543" cy="291" r="2.2" fill="#ff7a59"/><circle style="animation:m1 12s ease-out -0.62s infinite" cx="530" cy="366" r="1.2" fill="#ff7a59"/><circle style="animation:m2 12s ease-out -6.53s infinite" cx="524" cy="297" r="2.2" fill="#f9a8d4"/><circle style="animation:m3 12s ease-out -3.35s infinite" cx="463" cy="304" r="1.6" fill="#ffb347"/><circle style="animation:m4 12s ease-out -7.41s infinite" cx="304" cy="358" r="1.2" fill="#ffb347"/><circle style="animation:m5 12s ease-out -11.52s infinite" cx="448" cy="255" r="1.2" fill="#ff7a59"/><circle style="animation:m6 12s ease-out -10.51s infinite" cx="427" cy="338" r="2.2" fill="#f9a8d4"/><circle style="animation:m7 12s ease-out -3.59s infinite" cx="423" cy="298" r="1.6" fill="#ffb347"/><circle style="animation:m8 12s ease-out -3.98s infinite" cx="560" cy="216" r="2.2" fill="#f9a8d4"/><circle style="animation:m9 12s ease-out -3.72s infinite" cx="712" cy="216" r="1.6" fill="#ff7a59"/><circle style="animation:m10 12s ease-out -5.67s infinite" cx="398" cy="323" r="1.2" fill="#ffb347"/><circle style="animation:m11 12s ease-out -0.22s infinite" cx="752" cy="303" r="1.6" fill="#f9a8d4"/><circle style="animation:m12 12s ease-out -0.56s infinite" cx="38" cy="315" r="1.2" fill="#ffb347"/><circle style="animation:m13 12s ease-out -6.15s infinite" cx="966" cy="288" r="2.2" fill="#ff7a59"/><circle style="animation:m14 12s ease-out -8.98s infinite" cx="241" cy="350" r="1.6" fill="#ff7a59"/><circle style="animation:m15 12s ease-out -4.09s infinite" cx="206" cy="253" r="2.2" fill="#ffb347"/><circle style="animation:m16 12s ease-out -11.09s infinite" cx="716" cy="270" r="2.2" fill="#f9a8d4"/><circle style="animation:m17 12s ease-out -2.13s infinite" cx="668" cy="278" r="1.2" fill="#f9a8d4"/><circle style="animation:m18 12s ease-out -1.94s infinite" cx="653" cy="323" r="1.2" fill="#f9a8d4"/><circle style="animation:m19 12s ease-out -2.85s infinite" cx="851" cy="208" r="2.2" fill="#ff7a59"/><circle style="animation:m20 12s ease-out -5.06s infinite" cx="953" cy="366" r="1.2" fill="#ff7a59"/><circle style="animation:m21 12s ease-out -1.57s infinite" cx="704" cy="253" r="2.2" fill="#ff7a59"/><circle style="animation:m22 12s ease-out -5.21s infinite" cx="238" cy="243" r="1.2" fill="#ff7a59"/><circle style="animation:m23 12s ease-out -5.44s infinite" cx="623" cy="236" r="2.2" fill="#ff7a59"/><circle style="animation:m24 12s ease-out -8.75s infinite" cx="1019" cy="376" r="1.6" fill="#ff7a59"/><circle style="animation:m25 12s ease-out -1.35s infinite" cx="846" cy="237" r="2.2" fill="#ff7a59"/></g>

  <!-- MARK: three open rings (people · voice · technology), the voice ripples outward from where they meet -->
  <g><circle class="wave" style="animation-delay:-0.0s" cx="176" cy="180" r="22" fill="none" stroke="#5eead4" stroke-width="1.6"/><circle class="wave" style="animation-delay:-3.0s" cx="176" cy="180" r="22" fill="none" stroke="#5eead4" stroke-width="1.6"/><circle class="wave" style="animation-delay:-6.0s" cx="176" cy="180" r="22" fill="none" stroke="#5eead4" stroke-width="1.6"/><circle class="wave" style="animation-delay:-9.0s" cx="176" cy="180" r="22" fill="none" stroke="#5eead4" stroke-width="1.6"/></g>
  <g filter="url(#glow)"><circle class="ring" style="animation-delay:-0.0s;transform-origin:176.0px 150.0px" cx="176.0" cy="150.0" r="46" fill="#ffb347" fill-opacity=".10" stroke="#ffb347" stroke-width="2.4"/><circle class="ring" style="animation-delay:-4.0s;transform-origin:202.0px 195.0px" cx="202.0" cy="195.0" r="46" fill="#ff4d6d" fill-opacity=".10" stroke="#ff4d6d" stroke-width="2.4"/><circle class="ring" style="animation-delay:-8.0s;transform-origin:150.0px 195.0px" cx="150.0" cy="195.0" r="46" fill="#5eead4" fill-opacity=".10" stroke="#5eead4" stroke-width="2.4"/></g>
  <circle class="core" cx="176" cy="180" r="7" fill="#fff7ed" filter="url(#glow)"/>

  <g class="sans" font-size="68" font-weight="800" letter-spacing="6">
    <text x="337" y="126" fill="url(#sun)" filter="url(#warm)">TRINITY AI LABS</text>
    <text x="337" y="126" fill="url(#shine)">TRINITY AI LABS</text>
  </g>
  <text x="340" y="160" font-size="15" letter-spacing="9" fill="#fecdd3" fill-opacity=".85">MUNICH · LOCAL-FIRST · VOICE-FIRST</text>

  <g class="braille" filter="url(#glow)"><circle cx="340" cy="215" r="2.6"/><circle cx="340" cy="222" r="2.6"/><circle cx="347" cy="208" r="2.6"/><circle cx="347" cy="215" r="2.6"/><circle cx="362" cy="208" r="2.6"/><circle cx="362" cy="215" r="2.6"/><circle cx="362" cy="222" r="2.6"/><circle cx="369" cy="215" r="2.6"/><circle cx="384" cy="215" r="2.6"/><circle cx="391" cy="208" r="2.6"/><circle cx="406" cy="208" r="2.6"/><circle cx="406" cy="222" r="2.6"/><circle cx="413" cy="208" r="2.6"/><circle cx="413" cy="215" r="2.6"/><circle cx="428" cy="215" r="2.6"/><circle cx="435" cy="208" r="2.6"/><circle cx="450" cy="215" r="2.6"/><circle cx="450" cy="222" r="2.6"/><circle cx="457" cy="208" r="2.6"/><circle cx="457" cy="215" r="2.6"/><circle cx="472" cy="208" r="2.6"/><circle cx="472" cy="222" r="2.6"/><circle cx="479" cy="208" r="2.6"/><circle cx="479" cy="215" r="2.6"/><circle cx="479" cy="222" r="2.6"/></g>
  <text x="504" y="223" font-size="13" fill="#ffd8a8" fill-opacity=".8">← TRINITY, in braille</text>

  <g class="a"><text x="340" y="270" font-size="21" fill="#fff7ed">Most software asks you to look.</text>
    <text x="340" y="296" font-size="16" fill="#e9d5c9" fill-opacity=".85">Die meiste Software will, dass du hinsiehst.</text></g>
  <g class="b"><text x="340" y="270" font-size="21" fill="#fff7ed">We build software that <tspan fill="#5eead4">listens</tspan>.</text>
    <text x="340" y="296" font-size="16" fill="#e9d5c9" fill-opacity=".85">Wir bauen Software, die zuhört.</text></g>
  <text x="340" y="332" font-size="16" fill="#fda4af">&gt; come in · build what makes sense<tspan class="blink" fill="#5eead4"> ▌</tspan></text>
  <text x="1186" y="350" text-anchor="end" font-size="10" fill="#fff" opacity=".18">// pull requests welcome</text>
  </g>
</svg>